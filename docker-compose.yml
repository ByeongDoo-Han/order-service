services:
  mysql:
    image: mysql:8.0
    container_name: sajeon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sajeon-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sajeon-core-service
    ports:
      - "${CORE_SERVICE_PORT:-8080}:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=sajeon
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sajeon-network

networks:
  sajeon-network:
    driver: bridge

volumes:
  mysql_data:
